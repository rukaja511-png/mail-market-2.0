<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexStore - User Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0b0b; color: #e5e5e5; padding-bottom: 50px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #000; border-bottom: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        .logo h1 { font-size: 18px; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }
        .card { background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card h2 { font-size: 16px; color: #00ffcc; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .input-group label { font-size: 12px; color: #aaa; font-weight: 500; }
        .input-group input, .input-group select, .input-group textarea { padding: 10px 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #00cc99; box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
        .data-table th { color: #00ffcc; background: #1a1a1a; }
        .badge-pending { background: rgba(255, 165, 0, 0.1); color: #ffa500; border: 1px solid #ffa500; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-approved { background: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid #00ffcc; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-rejected { background: rgba(255, 85, 85, 0.1); color: #ff5555; border: 1px solid #ff5555; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">
            <h1><i class="fa-solid fa-store"></i> ApexStore Marketplace</h1>
        </div>
        <div>
            <a href="admin.html" style="background: rgba(0,255,204,0.1); border: 1px solid #00ffcc; color: #00ffcc; padding: 6px 12px; border-radius: 6px; font-size: 12px; text-decoration: none; font-weight: 600;"><i class="fa-solid fa-shield-halved"></i> Admin Login</a>
        </div>
    </div>

    <div class="container">
        <!-- Account Info / Balance -->
        <div class="card">
            <h2><i class="fa-solid fa-wallet"></i> My Account & Profile</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>Your Name</label>
                    <input type="text" id="userName" value="John Doe">
                </div>
                <div class="input-group">
                    <label>Your Email (Identifier)</label>
                    <input type="email" id="userEmail" value="myuser@gmail.com" oninput="loadUserData()">
                </div>
                <div class="input-group">
                    <label>Available Balance (BDT)</label>
                    <input type="text" id="userBalanceDisplay" readonly style="color: #00ffcc; font-weight: bold;" value="0.00">
                </div>
            </div>
        </div>

        <!-- Deposit Request Card -->
        <div class="card">
            <h2><i class="fa-solid fa-money-bill-wave"></i> Add Money / Deposit Request</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>Select Payment Method</label>
                    <select id="depositMethodSelect">
                        <option value="">Loading methods...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Amount (BDT)</label>
                    <input type="number" id="depositAmount" placeholder="e.g. 500">
                </div>
                <div class="input-group">
                    <label>Transaction ID / Sender Number</label>
                    <input type="text" id="depositTrx" placeholder="e.g. 9N876543">
                </div>
            </div>
            <button class="btn" onclick="submitDeposit()">Submit Deposit Request</button>
        </div>

        <!-- Deposit History -->
        <div class="card">
            <h2><i class="fa-solid fa-history"></i> My Deposit History & Status</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Method</th>
                        <th>Amount</th>
                        <th>TrxID</th>
                        <th>Status / Reason</th>
                    </tr>
                </thead>
                <tbody id="userDepositHistoryBody">
                    <tr><td colspan="4" style="text-align: center; color: #777;">Loading history...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Support Ticket Card -->
        <div class="card">
            <h2><i class="fa-solid fa-headset"></i> Support / Help Center</h2>
            <div class="input-group">
                <label>Your Message / Problem</label>
                <textarea id="supportMessage" rows="3" placeholder="Describe your issue here..."></textarea>
            </div>
            <button class="btn" onclick="submitSupportTicket()">Send Support Ticket</button>

            <h3 style="font-size: 14px; color: #00ffcc; margin-top: 20px; margin-bottom: 10px;">Support History & Replies</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>My Message</th>
                        <th>Admin Reply</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="userSupportHistoryBody">
                    <tr><td colspan="3" style="text-align: center; color: #777;">No support tickets found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCIMosLNehv92LBKawC-53ErJ13QhnJy0",
            authDomain: "mywebsite-709e3.firebaseapp.com",
            databaseURL: "https://mywebsite-709e3-default-rtdb.firebaseio.com",
            projectId: "mywebsite-709e3",
            storageBucket: "mywebsite-709e3.firebasestorage.app",
            messagingSenderId: "218299688364",
            appId: "1:218299688364:web:bf48e2c069fd7d3702c609",
            measurementId: "G-5MSD1CCSVY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.onload = function() {
            loadUserData();
            loadPaymentMethodsDropdown();
        };

        function loadUserData() {
            let email = document.getElementById('userEmail').value.trim();
            if(!email) return;

            db.collection('users').doc(email).get().then(doc => {
                if(doc.exists) {
                    document.getElementById('userBalanceDisplay').value = (doc.data().balance || 0).toFixed(2);
                } else {
                    document.getElementById('userBalanceDisplay').value = "0.00";
                }
            });

            // Load Deposits
            db.collection('deposits').where('email', '==', email).onSnapshot(snapshot => {
                let historyBody = document.getElementById('userDepositHistoryBody');
                historyBody.innerHTML = '';
                if(snapshot.empty) {
                    historyBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">No deposit history found.</td></tr>`;
                    return;
                }
                snapshot.forEach(doc => {
                    let dep = doc.data();
                    let statusBadge = dep.status === 'Pending' ? `<span class="badge-pending">Pending</span>` : (dep.status === 'Approved' ? `<span class="badge-approved">Approved (+${dep.amount})</span>` : `<span class="badge-rejected">Rejected: ${dep.reason}</span>`);
                    historyBody.insertAdjacentHTML('beforeend', `<tr><td>${dep.method}</td><td>${dep.amount} BDT</td><td>${dep.trx}</td><td>${statusBadge}</td></tr>`);
                });
            });

            // Load Support Tickets
            db.collection('supports').where('email', '==', email).onSnapshot(snapshot => {
                let supportBody = document.getElementById('userSupportHistoryBody');
                supportBody.innerHTML = '';
                if(snapshot.empty) {
                    supportBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #777;">No support tickets found.</td></tr>`;
                    return;
                }
                snapshot.forEach(doc => {
                    let sup = doc.data();
                    let replyText = sup.reply ? `<span style="color: #00ffcc;">${sup.reply}</span>` : `<span style="color: #ffa500;">Waiting for reply...</span>`;
                    let statusBadge = sup.status === 'Resolved' ? `<span class="badge-approved">Resolved</span>` : `<span class="badge-pending">Pending</span>`;
                    supportBody.insertAdjacentHTML('beforeend', `<tr><td>${sup.message}</td><td>${replyText}</td><td>${statusBadge}</td></tr>`);
                });
            });
        }

        function loadPaymentMethodsDropdown() {
            db.collection('payments').onSnapshot(snapshot => {
                let methodDrop = document.getElementById('depositMethodSelect');
                methodDrop.innerHTML = '';
                if(snapshot.empty) {
                    methodDrop.innerHTML = `<option value="">No payment methods available</option>`;
                    return;
                }
                snapshot.forEach(doc => {
                    let m = doc.data();
                    let opt = document.createElement('option');
                    opt.value = `${m.name} (${m.num})`;
                    opt.innerText = `${m.name} - ${m.num} (${m.type})`;
                    methodDrop.appendChild(opt);
                });
            });
        }

        function submitDeposit() {
            let name = document.getElementById('userName').value.trim();
            let email = document.getElementById('userEmail').value.trim();
            let method = document.getElementById('depositMethodSelect').value;
            let amount = parseFloat(document.getElementById('depositAmount').value);
            let trx = document.getElementById('depositTrx').value.trim();

            if(!name || !email || !method || isNaN(amount) || !trx) {
                alert('Please fill out all fields properly!');
                return;
            }

            db.collection('deposits').add({
                name, email, method, amount, trx,
                status: 'Pending',
                reason: '',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('depositAmount').value = '';
                document.getElementById('depositTrx').value = '';
                alert('Deposit request submitted successfully!');
                loadUserData();
            });
        }

        function submitSupportTicket() {
            let name = document.getElementById('userName').value.trim();
            let email = document.getElementById('userEmail').value.trim();
            let message = document.getElementById('supportMessage').value.trim();

            if(!name || !email || !message) {
                alert('Please enter your name, email and message!');
                return;
            }

            db.collection('supports').add({
                name, email, message,
                reply: '',
                status: 'Pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('supportMessage').value = '';
                alert('Support ticket sent successfully!');
            });
        }
    </script>
</body>
</html>
